[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-sre-agent"
version = "1.0.0"
description = "Enterprise Incident Triage & Autonomous Remediation Multi-Agent System built with Google ADK and Vertex AI Agent Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Callum McKenney" }
]
dependencies = [
  "google-adk>=1.2.0",
  "google-genai>=1.5.0",
  "google-cloud-aiplatform[agent_engines,evaluation]>=1.78.0",
  "google-cloud-discoveryengine>=0.13.0",
  "google-cloud-dlp>=3.25.0",
  "google-cloud-logging>=3.11.0",
  "google-cloud-modelarmor>=0.1.0",
  "google-cloud-secret-manager>=2.21.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-gcp-trace>=1.8.0",
  "pydantic>=2.9.0",
  "sqlalchemy>=2.0.35",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["sentinel_sre_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
