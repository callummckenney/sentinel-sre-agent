name: Sentinel AgentOps CI & Regression Evaluation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-and-golden-eval:
    name: Secret Scan, Unit Tests & Golden Dataset Regression Suite
    runs-on: ubuntu-latest
    env:
      SENTINEL_RUNTIME_MODE: local
      GOOGLE_CLOUD_PROJECT: sentinel-ci-eval
      GOOGLE_CLOUD_LOCATION: us-central1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check sentinel_sre_agent tests

      - name: Execute Unit, Integration & Golden Dataset Regression Suite
        run: pytest -v --cov=sentinel_sre_agent

  terraform-iac-validation:
    name: Validate Terraform IaC Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init (Backendless) & Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
